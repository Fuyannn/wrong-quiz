<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="9.22 错题专场" />
<meta name="format-detection" content="telephone=no" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<title>9.22 错题专场</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1b1f24;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #2563eb;
    --accent-soft: #eff6ff;
    --ok: #16a34a;
    --ok-soft: #ecfdf5;
    --bad: #dc2626;
    --bad-soft: #fef2f2;
    --warn: #d97706;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #e8eaed;
      --muted: #9aa1ac;
      --line: #262b34;
      --accent: #5b8cff;
      --accent-soft: #17233d;
      --ok: #34d399;
      --ok-soft: #12271f;
      --bad: #f87171;
      --bad-soft: #2a1618;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 14px 96px; }
  .top { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 2px 10px; margin-bottom: 14px; }
  .top h1 { font-size: 19px; margin: 0; letter-spacing: .3px; }
  .top .sub { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .stat .n { font-size: 26px; font-weight: 650; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .label { font-size: 13px; color: var(--muted); margin: 4px 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 14px;
    cursor: pointer;
    transition: .15s;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary {
    width: 100%;
    border: 0;
    background: var(--accent);
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    padding: 15px;
    border-radius: var(--radius);
    cursor: pointer;
  }
  button.ghost {
    width: 100%;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    font-size: 15px;
    padding: 13px;
    border-radius: var(--radius);
    cursor: pointer;
    margin-top: 10px;
  }
  .bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 12px 0 4px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
  .row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .tag { font-size: 11px; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); border: 1px solid transparent; }
  .tag.bad { background: var(--bad-soft); color: var(--bad); }
  .tag.plain { background: transparent; color: var(--muted); border-color: var(--line); }
  .stem { font-size: 17px; line-height: 1.7; margin: 2px 0 14px; white-space: pre-wrap; }
  .stem img, .opt img, .explain img { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; }
  .opts { display: grid; gap: 10px; }
  .opt {
    display: flex; gap: 11px; align-items: flex-start;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 12px;
    padding: 13px;
    cursor: pointer;
    transition: .15s;
    text-align: left;
    color: var(--text);
    font-size: 16px;
    line-height: 1.6;
    width: 100%;
  }
  .opt .k {
    flex: 0 0 26px; height: 26px; border-radius: 50%;
    border: 1px solid var(--line);
    display: grid; place-items: center;
    font-size: 13px; font-weight: 600; color: var(--muted);
  }
  .opt[data-state="picked"] { border-color: var(--accent); background: var(--accent-soft); }
  .opt[data-state="picked"] .k { background: var(--accent); border-color: var(--accent); color: #fff; }
  .opt[data-state="right"] { border-color: var(--ok); background: var(--ok-soft); }
  .opt[data-state="right"] .k { background: var(--ok); border-color: var(--ok); color: #fff; }
  .opt[data-state="wrong"] { border-color: var(--bad); background: var(--bad-soft); }
  .opt[data-state="wrong"] .k { background: var(--bad); border-color: var(--bad); color: #fff; }
  .verdict { border-radius: 12px; padding: 12px 13px; margin-top: 14px; font-size: 15px; border: 1px solid var(--line); }
  .verdict.right { background: var(--ok-soft); border-color: var(--ok); }
  .verdict.wrong { background: var(--bad-soft); border-color: var(--bad); }
  .verdict b { font-weight: 650; }
  .explain { margin-top: 8px; font-size: 15px; line-height: 1.7; color: var(--text); white-space: pre-wrap; }
  .explain .h { font-size: 12px; color: var(--muted); margin-bottom: 4px; letter-spacing: .5px; }

  .navbar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: color-mix(in srgb, var(--card) 92%, transparent);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
  }
  .navbar .inner { max-width: 720px; margin: 0 auto; display: flex; gap: 10px; }
  .navbar button {
    flex: 1; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
    color: var(--text); font-size: 15px; padding: 12px; cursor: pointer;
  }
  .navbar button.main { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .navbar button:disabled { opacity: .45; cursor: default; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(84px + env(safe-area-inset-bottom));
    background: #111827; color: #fff; font-size: 14px;
    padding: 9px 16px; border-radius: 999px; opacity: 0; transition: opacity .2s;
    pointer-events: none; z-index: 50; max-width: 88vw; text-align: center;
  }
  .toast.show { opacity: .95; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 15px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script src="data.js?v=f8cb1dabe4"></script>
<script>
(function () {
  "use strict";

  // data.js 提供 window.QUIZ_DATA = { meta, questions: [...] }
  var DATA = window.QUIZ_DATA || { meta: {}, questions: [] };
  var QUESTIONS = (DATA.questions || []).filter(function (q) { return q && q.stem; });
  var META = DATA.meta || {};
  var STORE_KEY = META.storeKey || "wrongquiz.progress.v1";
  var SETTINGS_KEY = META.settingsKey || "wrongquiz.settings.v1";
  var MASTER_STREAK = 2; // 连续答对几次算掌握

  var state = {
    screen: "home",          // home | quiz | done
    filter: "wrong2",        // all | wrong2 | unmastered
    subject: "all",
    order: "random",         // seq | random
    queue: [],
    idx: 0,
    picked: [],
    revealed: false,
    session: { right: 0, wrong: 0, started: 0, mastered: 0 }
  };

  var progress = load(STORE_KEY, {});
  var settings = load(SETTINGS_KEY, { filter: "wrong2", order: "random", subject: "all" });
  state.filter = settings.filter || "wrong2";
  state.order = settings.order || "random";
  state.subject = settings.subject || "all";

  function load(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }
  function p(id) {
    if (!progress[id]) progress[id] = { right: 0, wrong: 0, streak: 0, mastered: false, ts: 0 };
    return progress[id];
  }
  function wrongCount(q) { return Number(q.wrongCount || 0); }
  function subjects() {
    var seen = {};
    QUESTIONS.forEach(function (q) { if (q.subject) seen[q.subject] = 1; });
    return Object.keys(seen).sort();
  }
  function qDates(q) {
    return q.dates && q.dates.length ? q.dates : (q.date ? [q.date] : []);
  }
  function match(q, filter, subject) {
    if (subject !== "all" && q.subject !== subject) return false;
    if (filter === "all") return true;
    if (filter === "wrong2") return wrongCount(q) >= 2;
    if (filter === "unmastered") return !p(q.id).mastered;
    if (filter.indexOf("day:") === 0) return qDates(q).indexOf(filter.slice(4)) !== -1;
    return true;
  }
  function inFilter(q) { return match(q, state.filter, state.subject); }
  function countFor(filter) {
    var n = 0;
    for (var i = 0; i < QUESTIONS.length; i++) if (match(QUESTIONS[i], filter, state.subject)) n++;
    return n;
  }
  function allDates() {
    var seen = {};
    QUESTIONS.forEach(function (q) { qDates(q).forEach(function (d) { if (d) seen[d] = 1; }); });
    return Object.keys(seen).sort().reverse();
  }
  function pool() { return QUESTIONS.filter(inFilter); }
  function masteredCount() {
    return QUESTIONS.filter(function (q) { return p(q.id).mastered; }).length;
  }
  function wrong2Count() { return QUESTIONS.filter(function (q) { return wrongCount(q) >= 2; }).length; }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }
  function img(src, alt) {
    if (!src) return "";
    return '<img src="' + esc(src) + '" alt="' + esc(alt || "") + '" loading="lazy" />';
  }
  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove("show"); }, 1800);
  }
  function el(id) { return document.getElementById(id); }

  function start(mode) {
    var list = pool();
    if (!list.length) { toast("当前筛选下没有题目"); return; }
    state.queue = (state.order === "random" || mode === "random") ? shuffle(list) : list;
    state.idx = 0;
    state.picked = [];
    state.revealed = false;
    state.session = { right: 0, wrong: 0, started: Date.now(), mastered: 0 };
    state.screen = "quiz";
    render();
    window.scrollTo(0, 0);
  }

  function current() { return state.queue[state.idx]; }

  function answerKeys(q) {
    var a = q.answer;
    if (Array.isArray(a)) return a.map(function (x) { return String(x).trim().toUpperCase(); }).filter(Boolean);
    return String(a == null ? "" : a).split(/[,，\s]+/).map(function (x) { return x.trim().toUpperCase(); }).filter(Boolean);
  }
  function isMulti(q) { return answerKeys(q).length > 1; }

  function pick(key) {
    if (state.revealed) return;
    var q = current();
    if (isMulti(q)) {
      var i = state.picked.indexOf(key);
      if (i === -1) state.picked.push(key); else state.picked.splice(i, 1);
      render();
    } else {
      state.picked = [key];
      reveal();
    }
  }

  function reveal() {
    var q = current();
    var correct = answerKeys(q);
    var mine = state.picked.slice().sort();
    var right = mine.length === correct.length && mine.every(function (k, i) { return k === correct[i]; });
    var rec = p(q.id);
    if (right) {
      rec.right++; rec.streak++;
      if (rec.streak >= MASTER_STREAK && !rec.mastered) { rec.mastered = true; state.session.mastered++; }
      state.session.right++;
    } else {
      rec.wrong++; rec.streak = 0; rec.mastered = false;
      state.session.wrong++;
    }
    rec.ts = Date.now();
    save(STORE_KEY, progress);
    state.revealed = true;
    state.lastRight = right;
    render();
  }

  function next() {
    if (state.idx + 1 >= state.queue.length) { state.screen = "done"; }
    else { state.idx++; }
    state.picked = [];
    state.revealed = false;
    render();
    window.scrollTo(0, 0);
  }

  function back() {
    if (state.idx === 0) { state.screen = "home"; }
    else { state.idx--; state.picked = []; state.revealed = false; }
    render();
    window.scrollTo(0, 0);
  }

  function renderHome() {
    var total = QUESTIONS.length;
    var w2 = wrong2Count();
    var ms = masteredCount();
    var subj = subjects();
    var list = pool();
    var h = "";

    h += '<div class="top"><h1>' + esc(DATA.meta.title || "错题重练") + '</h1><span class="sub">' + esc(DATA.meta.range || "") + '</span></div>';
    h += '<div class="grid">';
    h += '  <div class="stat"><div class="n">' + total + '</div><div class="l">错题总数</div></div>';
    h += '  <div class="stat"><div class="n">' + w2 + '</div><div class="l">错 2 次以上</div></div>';
    h += '  <div class="stat"><div class="n">' + ms + '</div><div class="l">已掌握</div></div>';
    h += '  <div class="stat"><div class="n">' + list.length + '</div><div class="l">当前范围题数</div></div>';
    h += '</div>';

    var dates = allDates();
    var scopes = [["wrong2", "只练错2次以上"]];
    // 只有跨多天的累计版才显示按天筛选；单日专场不显示
    var isMultiDay = String(META.range || "").indexOf("~") !== -1;
    if (isMultiDay && dates.length > 1) dates.forEach(function (d) { scopes.push(["day:" + d, d.slice(5).replace("-", ".") + " 全部"]); });
    scopes.push(["unmastered", "未掌握"], ["all", "全部错题"]);

    h += '<div class="card" style="margin-top:12px">';
    h += '  <div class="label">范围</div><div class="chips">';
    scopes.forEach(function (o) {
      h += '<button class="chip" data-act="filter" data-v="' + o[0] + '" aria-pressed="' + (state.filter === o[0]) + '">' + o[1] + " " + countFor(o[0]) + '</button>';
    });
    h += '  </div>';

    if (subj.length > 1) {
      h += '  <div class="label" style="margin-top:14px">题型</div><div class="chips">';
      h += '<button class="chip" data-act="subject" data-v="all" aria-pressed="' + (state.subject === "all") + '">全部</button>';
      subj.forEach(function (s) {
        h += '<button class="chip" data-act="subject" data-v="' + esc(s) + '" aria-pressed="' + (state.subject === s) + '">' + esc(s) + '</button>';
      });
      h += '  </div>';
    }

    h += '  <div class="label" style="margin-top:14px">顺序</div><div class="chips">';
    [["random", "乱序"], ["seq", "按顺序"]].forEach(function (o) {
      h += '<button class="chip" data-act="order" data-v="' + o[0] + '" aria-pressed="' + (state.order === o[0]) + '">' + o[1] + '</button>';
    });
    h += '  </div>';
    h += '</div>';

    h += '<button class="primary" data-act="start">开始刷题（' + list.length + ' 题）</button>';
    h += '<button class="ghost" data-act="reset">清空做题进度</button>';

    if (DATA.meta.note) h += '<div class="hint">' + esc(DATA.meta.note) + '</div>';
    if (!total) h += '<div class="empty">还没有题目数据</div>';
    el("app").innerHTML = h;
  }

  function renderQuiz() {
    var q = current();
    if (!q) { state.screen = "home"; return renderHome(); }
    var rec = p(q.id);
    var correct = answerKeys(q);
    var multi = isMulti(q);
    var h = "";

    var pct = Math.round(state.idx / state.queue.length * 100);
    h += '<div class="top"><h1>' + (state.idx + 1) + ' / ' + state.queue.length + '</h1><span class="sub">答对 ' + state.session.right + ' · 答错 ' + state.session.wrong + '</span></div>';
    h += '<div class="bar"><i style="width:' + pct + '%"></i></div>';

    h += '<div class="card" style="margin-top:12px">';
    h += '  <div class="meta">';
    if (q.subject) h += '<span class="tag">' + esc(q.subject) + '</span>';
    if (q.date) h += '<span class="tag plain">' + esc(q.date) + '</span>';
    if (wrongCount(q)) h += '<span class="tag bad">错过 ' + wrongCount(q) + ' 次</span>';
    if (rec.mastered) h += '<span class="tag">已掌握</span>';
    if (multi) h += '<span class="tag plain">多选</span>';
    h += '  </div>';
    h += '  <div class="stem">' + esc(q.stem) + img(q.stemImage, "题干图") + '</div>';

    h += '  <div class="opts">';
    (q.options || []).forEach(function (o) {
      var key = String(o.key || "").toUpperCase();
      var st = "";
      if (state.revealed) {
        if (correct.indexOf(key) !== -1) st = "right";
        else if (state.picked.indexOf(key) !== -1) st = "wrong";
      } else if (state.picked.indexOf(key) !== -1) {
        st = "picked";
      }
      h += '<button class="opt" data-act="pick" data-k="' + esc(key) + '" data-state="' + st + '">';
      h += '  <span class="k">' + esc(key) + '</span>';
      h += '  <span>' + esc(o.text) + img(o.image, "") + '</span>';
      h += '</button>';
    });
    h += '  </div>';

    if (state.revealed) {
      h += '<div class="verdict ' + (state.lastRight ? "right" : "wrong") + '">';
      h += state.lastRight ? '<b>答对了</b>' : '<b>答错了</b>';
      h += ' 正确答案：<b>' + esc(correct.join("")) + '</b>';
      if (!state.lastRight && state.picked.length) h += ' · 你选了 <b>' + esc(state.picked.join("")) + '</b>';
      h += '</div>';
      if (q.explanation || q.explanationImage) {
        h += '<div class="explain"><div class="h">解析</div>' + esc(q.explanation || "") + img(q.explanationImage, "解析图") + '</div>';
      }
    }
    h += '</div>';

    if (multi && !state.revealed) {
      h += '<div class="hint">多选：选好后点「确认」</div>';
    }
    el("app").innerHTML = h;

    var nav = document.createElement("div");
    nav.className = "navbar";
    var inner = '<div class="inner">';
    inner += '<button data-act="back">' + (state.idx === 0 ? "返回" : "上一题") + '</button>';
    if (!state.revealed && multi) inner += '<button class="main" data-act="confirm" ' + (state.picked.length ? "" : "disabled") + '>确认</button>';
    else if (!state.revealed) inner += '<button class="main" data-act="reveal">看答案</button>';
    else inner += '<button class="main" data-act="next">' + (state.idx + 1 >= state.queue.length ? "完成" : "下一题") + '</button>';
    inner += '</div>';
    nav.innerHTML = inner;
    var old = document.querySelector(".navbar");
    if (old) old.remove();
    document.body.appendChild(nav);
  }

  function renderDone() {
    var old = document.querySelector(".navbar");
    if (old) old.remove();
    var s = state.session;
    var mins = Math.max(1, Math.round((Date.now() - s.started) / 60000));
    var h = "";
    h += '<div class="top"><h1>本轮完成</h1><span class="sub">用时约 ' + mins + ' 分钟</span></div>';
    h += '<div class="grid">';
    h += '  <div class="stat"><div class="n">' + state.queue.length + '</div><div class="l">本轮题数</div></div>';
    h += '  <div class="stat"><div class="n">' + (s.right + s.wrong ? Math.round(s.right / (s.right + s.wrong) * 100) : 0) + '%</div><div class="l">正确率</div></div>';
    h += '  <div class="stat"><div class="n">' + s.right + '</div><div class="l">答对</div></div>';
    h += '  <div class="stat"><div class="n">' + s.wrong + '</div><div class="l">答错</div></div>';
    h += '</div>';
    if (s.mastered) h += '<div class="hint">本轮有 ' + s.mastered + ' 题达成「连续答对 ' + MASTER_STREAK + ' 次」，已标记为掌握。</div>';
    h += '<button class="primary" style="margin-top:14px" data-act="start">再刷一轮</button>';
    h += '<button class="ghost" data-act="home">回到首页</button>';
    el("app").innerHTML = h;
  }

  function render() {
    if (state.screen === "quiz") renderQuiz();
    else if (state.screen === "done") renderDone();
    else renderHome();
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]");
    if (!t) return;
    var act = t.getAttribute("data-act");
    var v = t.getAttribute("data-v");
    if (act === "filter") { state.filter = v; settings.filter = v; save(SETTINGS_KEY, settings); render(); }
    else if (act === "subject") { state.subject = v; settings.subject = v; save(SETTINGS_KEY, settings); render(); }
    else if (act === "order") { state.order = v; settings.order = v; save(SETTINGS_KEY, settings); render(); }
    else if (act === "start") { start("random"); }
    else if (act === "pick") { pick(t.getAttribute("data-k")); }
    else if (act === "confirm") { reveal(); }
    else if (act === "reveal") { state.picked = []; reveal(); }
    else if (act === "next") { next(); }
    else if (act === "back") { back(); }
    else if (act === "home") { state.screen = "home"; render(); window.scrollTo(0, 0); }
    else if (act === "reset") {
      if (confirm("清空所有做题进度？题目本身不会删。")) {
        progress = {}; save(STORE_KEY, progress); render(); toast("进度已清空");
      }
    }
  });

  render();
})();
</script>
</body>
</html>
